# GT 生成配置 —— Step 0 锁定的决策（见 docs/implementation-steps.md）

output:                                 # 生产轨迹结果落盘（scripts/demo_scene.py 各 demo）
  root: "/media/a/新加卷/tempt/5"        # 结果根目录；文件名含工件名以区分不同工件

traj_downsample:                        # 关键帧稀疏采样参数（scripts/traj_downsample.py：Scene 轨迹 → (L,8) 关键帧）
  w_trans: 1.0                          # SE(3) 运动度量平移权重
  w_rot: 0.1                            # SE(3) 运动度量旋转权重（rad→m 折算，1 rad ≈ w_rot 米）
  D_target: 0.1                         # 图搜索相邻关键帧目标运动量阈值（SE(3) 距离）
  node_step: 500                         # 固定锚点节点步长：每 node_step 帧保底一个关键帧（首尾必含）

seam:                                   # 焊缝加载/过滤（Scene._load_seam）
  min_length_cm: 3.0                    # 焊缝长度(corrected_p0↔p1 直线距离)小于此值的焊缝丢弃

robot:                                  # 决策 B
  # cfg_path: "/home/a/Datas/curobo/example_new_robot/urdf_12e_260626/ur12e_full.yml"
  # usd_path: "/home/a/Datas/curobo/example_new_robot/urdf_12e_260626/robot_description_wo_cam_cover.usd"
  cfg_path: "/kpfs_dataset/dataset/baiyu/code/render/urdf_12e_260626_remote/ur12e_full.yml"
  usd_path: "/kpfs_dataset/dataset/baiyu/code/render/urdf_12e_260626_remote/robot_description_wo_cam_cover.usd"
  # 新版机械臂(2026-06-26)：base=a1_ground_rail_platform, accessory=No012_TRM651, cable=No001_12ebarket。
  # 由 scripts/build_robot_from_xacro_pkg.py 从 urdf_12e_260626/xiaoyu_description 离线生成(碰撞球 CPU 拟合)。
  # ee_link / joint_names / retract_config 从上面的 cfg 读取，不在此重复

# constraint:                             # 决策 A
#   scope: "whole_arm"                    # 整臂本体（整条臂扫掠体积 ⊆ FREE）

# scene:                                  # 决策 C
#   format: "obj_mesh"                    # 输入为 watertight .obj
#   example: "/media/a/新加卷/hanfeng/segment_sub_output/BEAM_1aEEYa00Ed5Z4sE34qDJKu_part/BEAM_1aEEYa00Ed5Z4sE34qDJKu_part_watertight.obj"
#   # 焊缝/目标位姿来源（hanfeng_* 字段）
#   weld_pkl_example: "/home/a/Datas/20251201/aligned_ifc_parts_7/BEAM_1GMGl500020p4pD3WmDJ8n_part.pkl"

sensor:                                 # 决策 D + E
  mode: "self_raycast"                  # 自己对 mesh raycast，不依赖 Isaac 渲染
  max_depth_m: 3.0                      # raycast 深度上限 3 米（决策 D）
  camera:                               # 单目=IsaacLab camera_left_cfg（TiledCameraCfg，Link6/camera_left）
    name: "camera_left"
    width: 2208
    height: 1242
    modalities: ["rgb", "depth"]
    # 针孔模型原始参数（IsaacLab PinholeCameraCfg：camera_left，fov≈92°×60°）
    focal_length: 4.01
    focus_distance: 480.0
    horizontal_aperture: 8.305
    vertical_aperture: 4.672
    clipping_range: [1.0e-5, 1.0e+3]     # 注意：实际 raycast 截断用 max_depth_m=3.0
    # 推导像素内参 fx=focal*width/h_aperture=4.01*2208/8.305≈1066.1；fy=focal*height/v_aperture≈1066.1；cx=W/2, cy=H/2
    intrinsics: {fx: 1066.12, fy: 1066.06, cx: 1104.0, cy: 621.0}
    # 安装：相对 Link6（注意不是 ee_link xiaoyu_tip_link）= camera_left_cfg.offset（convention="ros"）
    # 【单一真源】此外参既供 sensor raycast，也由 stomp ik_cam_pose 读取（UR12e_t 求观测位姿 IK）——两处必须同一台相机
    # 相机帧 = T_base_Link6 @ T(extrinsic_pos, extrinsic_quat_wxyz)
    # 光学约定 OpenCV/ROS：+Z=视线朝前、+X 右、+Y 下；不套 USD 的 diag(1,-1,-1) 翻转
    mount_link: "Link6"
    extrinsic_pos: [0.05018328, 0.09963676, 0.14782703]
    # 此 quat 按 (w,x,y,z) 解释（= cuRobo 约定，无需转换）
    extrinsic_quat_wxyz: [0.02269110, 0.03172106, 0.00070220, -0.99923861]
    reference: "/home/a/Projects/Github/kejian_benchmark/gt_benchmark_pose_fast"  # env/ik_cam.py, gt_math.py
  camera_right:                           # 右目=IsaacLab camera_right_cfg —— 仅存档记录，当前管线不读（单目 raycast 用上面的 camera）
    name: "camera_right"
    width: 2208
    height: 1242
    modalities: ["rgb", "depth"]
    focal_length: 4.01                    # 内参与左目相同（同型相机）
    focus_distance: 480.0
    horizontal_aperture: 8.305
    vertical_aperture: 4.672
    clipping_range: [1.0e-5, 1.0e+3]
    intrinsics: {fx: 1066.12, fy: 1066.06, cx: 1104.0, cy: 621.0}
    mount_link: "Link6"                    # camera_right_cfg.offset（convention="ros"）；旋转与左目一致，仅平移不同
    extrinsic_pos: [-0.06923272, 0.09421033, 0.14022987]
    extrinsic_quat_wxyz: [0.02269110, 0.03172106, 0.00070220, -0.99923861]

roi:                                    # 决策 H —— ROI 盒（单一来源；init_curobo 与 build_roi_voxmap 都读这里）
  # 由整臂可达工作空间实测（20000 随机关节角的碰撞球包围盒）+ 余量取整得到，见
  # docs/implementation-steps.md「ROI 标定」。两网格(voxmap / cuRobo voxel 世界)同框、不再各填默认。
  mode: "measured_box"                  # ROI 直接由 center/dims 给定（不再用 reach+expand 推算）
  center: [0.1, 0.0, 0.65]              # ROI 盒中心（base 系，米）
  dims: [3.8, 3.92, 3.6]                # ROI 盒尺寸（米）。每轴须为 voxel_size 整数倍：
                                        #   3.8/0.04=95, 3.92/0.04=98, 3.6/0.04=90（皆整数）。
                                        #   半体素(如 3.9→97.5)会触发 cuRobo CUDA/Python 栅格维度取整
                                        #   不一致 → voxel 占据沿该轴错位（见 config.roi_dims 注释）。
                                        #   config.roi_dims 会再吸附一次作兜底。
  voxel_size_m: 0.04                    # 体素边长（米）

goal:                                   # 末端目标相对焊缝的摆放（Step 10）
  standoff_cm: 10.0                     # 沿两面角平分方向(bisector, 背离工件)后退的 standoff 距离(cm)
                                        # 目的：目标离工件表面够远(>体素膨胀带)，纯 voxel 探索世界不会误判碰撞；
                                        # GT 轨迹终点即停在此 standoff 位姿（不再向表面靠近）。

compute_goal_pose:                      # 观测位姿(goal pose) ES 优化器参数（Scene.compute_goal_pose，包 compute_goal_poses2）
  # 除下列【方法级】键外，本段其余键名须与 stomp_planner/config_pose.ConfigurationPose 的属性【同名】，
  # Scene.compute_goal_pose 会逐个 setattr 到 ConfigurationPose（未列出的沿用其默认）；num_randoms_all /
  # num_envs 由 Scene 依 num_batches/num_randoms_* 自动重算，勿在此填。显式传参给方法可覆盖本段。
  include_obstacles: true               # 【方法级】是否把已放障碍并入 ScenePose2 碰撞世界（避障；open_cylinder 纯视觉跳过）
  obstacle_buffer_m: 0.12                # 【方法级】障碍并入碰撞世界前的膨胀量(米)：每块障碍 mesh 按 OBB 各维 +2·buffer 外扩，
                                        # 机械臂避障留安全间隙(同 STOMP 绕行 obstacle_buffer_m 语义)。只影响碰撞世界；
                                        # 遮挡视线(visionBlock)仍用真实尺寸避免过度保守；工件不膨胀。0=不膨胀。
                                        # !!!!!!!建议是roi.voxel_size_m的3倍！！！！！！！！！！！！！
  world_buffer_m: 0.18                   # 【方法级】碰撞世界统一安全间隙(米)：经 cuRobo collision_activation_distance
                                        # 对碰撞世界【所有 mesh(工件 + USD 世界裁剪 obj + 注入障碍)统一生效】——机械臂碰撞球
                                        # 离表面 <此距离即判“碰”，逼 ES 选出离工件/世界更远的观测位姿。与 obstacle_buffer_m
                                        # 区别：后者只 OBB 膨胀“额外添加”的障碍(type1/2/3)，对 ObserveAnything 整块世界当 piece
                                        # 的情形无效；本键正是为那种情形。0=只判真穿透(旧行为)。⚠对工件也生效，过大会让贴近
                                        # 焊缝的观测位姿全判碰而无解，建议 0.03~0.08 起调。
  horizontal: 2                         # 【方法级】关节限位选择：0=水平 / 1=垂直 / 其它=all（全范围，最宽松）
  device: cuda                          # 【方法级】计算设备
  # —— 【方法级】分量开关：false → 该代价整段置 0，不参与优化/接受门槛(用于诊断哪个分量卡住 finish) ——
  use_collision: true                   # collision 代价(⚠含 IK 可解性+物理碰撞两部分，一起关；关后 joints 仍算出交下游)
  use_insides: true                     # 视觉 insides 代价(焊缝点是否落在相机 FOV 六面体内)
  use_block: true                       # 视觉 block 代价(焊缝点视线是否被工件遮挡)
  # —— 进化策略采样规模（⚠ 调太小会触发优化器内部假设崩溃 reshape[0,6]，见 compute_goal_poses2；默认 8×100）——
  num_batches: 8                        # 并行批数
  num_randoms_new: 100                  # 每批新采样数（num_envs = num_batches*(num_randoms_new+num_randoms_old)）
  num_randoms_old: 0                    # 每批保留的旧精英数
  num_iterations: 100                   # 进化迭代轮数
  max_iterations: 300                   # 单次 solve 迭代上限
  max_iterations_refine: 40             # refine 阶段迭代上限
  num_steps: 5                          # 每个观测位姿覆盖的焊缝细分步数
  # 代价权重(collision/vision/insides/space/block/orientation…)沿用 ConfigurationPose 默认，需要时按其属性名在此加键覆盖。
  orient_gate_relax: 40                 # 接受门槛的朝向放宽角度(deg)：把“朝向好不好”降级为偏好(仍在 ES 目标里驱动朝 45°)，
                                        # 只有超过软上限的极端掠射(约>85°贴面)才判“没真正看到”。0=不放宽=旧行为。
                                        # 用途：障碍逼相机偏离 45° 平分线时，仍接受这种大角度可行观测(带板 seam 不再无解)。

init_free:                              # 初始引导 FREE 空间（见 docs/initial-free-space.md）
  # 末端相机初始视野极小，voxmap 全 UNKNOWN 时整臂扫掠必含 UNKNOWN → reach_pt=0，机械臂动不了。
  # 故在 retract（固定安全 home）邻域把"各关节小幅 ±dq 活动"整臂扫过的体素预标 FREE，让其能起步。
  # dq 由 tmp/plan_seam 轨迹标定：0.05rad 即 122/122 条起步(reach_idx≥4)，取 0.10rad 留余量。
  dq_rad: 0.10                          # 关节扫掠法：retract 各关节活动半幅（rad）
  cyl_radius_m: 0.60                    # 圆柱体法：半径（米，轴过 base 原点 x=y=0）
  cyl_height_m: 1.80                    # 圆柱体法：高度（米，从底面 z=cyl_z_min 往上）
  cyl_z_min_m: -0.02                    # 圆柱体法：底面 z（米，base 系）。固定底座 xiaoyu_base_link 的
                                        # 碰撞球最低扎到 base 系 z≈-0.002m（实测 FK），体素中心落到 z=-0.01 层；
                                        # 底面取 -0.02m 才盖得住这层、又不会多拉进下一层(z=-0.05)，否则这层恒为
                                        # UNKNOWN→每段运动都假阳性非 FREE。(voxel=0.04m；与 swept 排除底座球互为冗余兜底)
  box_min_m: [-0.6, -1.3, -0.5]         # 表示机械臂工作空间，立方体法：AABB 盒下界角点（米，base_link 系，轴对齐）
  box_max_m: [2.5, 1.3, 1.7]            # 表示机械臂工作空间，立方体法：AABB 盒上界角点（米）。中心落在 base_link，整块置 FREE

  method_for_init: "box"           # 机械臂初始 FREE 空间方案：cylinder=圆柱(cyl_*) | box=立方体(box_*_for_init)
  box_min_m_for_init: [-1.4, -1.0, -0.3]         # 表示机械臂初始free空间，立方体法：AABB 盒下界角点（米，base_link 系，轴对齐）
  box_max_m_for_init: [0.2, 1.0, 2.0]            # 表示机械臂初始free空间，立方体法：AABB 盒上界角点（米）。中心落在 base_link，整块置 FREE


  # 预存扫掠法（第四种）：retract + 若干关键关节角两两规划轨迹的整臂扫掠并集，离线算好存盘、免每次重算。
  # 由 scripts/viz_joints_open3d.py --save-init-free 产出（centers=体素中心 base 系米, voxel_size）；
  # set_initial_free_swept 加载并按当前 voxmap 映射回体素置 FREE。相对路径按项目根解析。
  swept_path: "configs/init_free_swept.npz"

plan_init_pose:                         # lookup 式初始位姿求解（scripts/plan_init_pose.py --solve）的关节角过滤
  # precompute_joint_table 对 n^6 采样的关节角做 FK 后，只保留焊枪末端位姿（base_link 系）满足下列约束的：
  #   ① xy 平面到原点距离 ∈ ee_xy_range_m；② z ∈ ee_z_range_m；③ 落在 init_free.box_min_m/box_max_m 盒内。
  ee_xy_range_m: [0.4, 1.2]             # 焊枪末端在 base_link 系 x [下限,上限]（米）
  ee_z_range_m: [-0.1, 0.1]             # 焊枪末端在 base_link 系 z [下限,上限]（米）
  # n_per_dof: [12, 12, 12, 24, 24, 24]   # 每关节采样档数 [link1..link6]；q_table = ∏ni = 2,949,120（≈ 旧 12^6=2.99M，不易 OOM）。
  # n_per_dof: [15, 15, 15, 24, 24, 24]   # 每关节采样档数 [link1..link6]；q_table = ∏ni = 2,949,120（≈ 旧 12^6=2.99M，不易 OOM）。
  n_per_dof: [12,12,12,12,12,12]   # 每关节采样档数 [link1..link6]；q_table = ∏ni = 2,985,984（≈ 旧 12^6=2.99M）。
                                        #   也可填标量(如 12)=各关节同档(=n^6，旧行为)。想加精度就调大对应关节；
                                        #   显存≈幸存者数×碰撞球，先小步加。改了此值须重算关节表缓存。
  collision_tolerance_m: 0.00           # 整臂/retract 碰撞球对工件 ESDF 的允许穿透阈值（米，d<=tol 判 safe）
  clearance_inflate_m: 0.01             # 间隙膨胀量(米)：所有碰撞球半径 +此值再判碰，等效要求整臂离工件留间隙；0=关闭。
                                        #   collision_tolerance_m 不支持负数(d=穿透代价恒>=0，<=负 tol 恒 False)，
                                        #   故“离工件留间隙”只能靠膨胀碰撞球半径实现，即本项。
  voxel_size_m: 0.01                    # 工件 ESDF 体素大小（米）
  solve_n_chunk: 50000                  # solve_one_weld_lookup 按候选 N 分块的块大小：Gz×N 的 pose 张量
                                        #   (Rz_stack/T1/T2/R_g/cos_g) 单张随 N 可达 ~GB，N≈2M 时一次性算会 OOM。
                                        #   逐块跑完整角度扫描，峰值显存只与本值相关、与全 N 无关；结果与不分块逐位一致。
                                        #   越小越省显存、Python 循环开销略增；显存紧就调小（如 20000）。
  n_seg: 20                             # save_seam_pkl 的 seam_line 插值点数
  joint_table_path: "configs/plan_init_joint_table.pt"  # precompute_joint_table 结果(.pt)的存储路径(相对项目根)；
                                        # InitPoseLookupSolver.save_joint_table 写入，可复用免去 n^6 重算。
  extra_joint_pt: "configs/sweep_ik_solutions.pt"  # 额外候选关节角来源(.pt 的 'q' 字段，如 sweep 生成)：precompute/load
                                        #   joint_table 后【追加】到候选表(不过 ee 范围/init_free 盒过滤，作显式候选；
                                        #   下游逐焊缝 reach/碰撞/snap 仍会筛)。""=关闭。改此文件不影响 joint_table 缓存。
  standoff_cm: 2.0                     # 焊枪头落点沿焊缝角平分线(bisector，远离工件方向)外移的 standoff 距离(cm)；
                                        # 0=落在焊缝中点。与 goal.standoff_cm 同义，但作用于初始位姿求解。
  snap_deg: 10.0                        # 候选朝向 vs 4 种允许朝向：xyz 逐轴旋转误差上限（度）；三轴全在内才保留并 snap 到该朝向
  base_overlap_filter: false             # 是否启用「固定底座(xiaoyu_base_link)碰撞球 vs 工件 在 base-xy 投影相交」过滤：
                                        #   相交=机械臂底座压在工件下/工件盖在底座上，丢弃该候选。
                                        #   true=做该过滤（默认）；false=关闭（允许工件摆在底座正上方）。
  workpiece_x_min_m: 0.36                # 工件距 base_link 原点【欧氏最近】的那个点，其 base-x 分量下限（米）：
                                        #   须 > 此值否则丢弃（工件离底座 x 向太近/在底座后方）。仅看正 x（严格大于）。
  workpiece_x_voxel_m: 0.03             # 上一过滤的稠密点集体素粒度（米）：工件表面按此 pitch 体素化，用体素中心
                                        #   当点集（与三角形大小解耦，大三角形也不漏采）。与碰撞 ESDF voxel_size_m 无关。
  arm_collision_recheck: true           # snap 后复检：把候选 R snap 到 90°整倍朝向、重算 t 会改变工件姿态，
                                        #   snap 前的碰撞过滤在此姿态下已失效。true=对最终 (Rv,t_new) 再查一次
                                        #   【retract 姿态整臂碰撞球 vs 工件 ESDF】，撞则丢弃（判据同 solve：
                                        #   含 clearance_inflate_m、d<=collision_tolerance_m 判 safe）；false=关闭。
  # 角度采样：先把焊缝平分线 align 到名义焊枪轴(-ee_x)得基准姿态 R0，再【绕 xiaoyu_tip_link 末端局部
  # x/y/z 轴】各转一点组成扰动 R_delta，R=R_delta@R0（三角全有效）。名义焊枪轴=末端局部 -x，故绕 x
  # 即焊枪自转 roll（指向不变），绕 y/z 为 tilt（改变焊枪指向）。可视化核实见 plan_init_pose.viz_tip_frame。
  # 每行 [min,max,step]（度，闭区间含端点）；step<=0 或 min==max 表示该轴只取 min（不转）。
  rot_x_deg: [-180, 180, 30]              # 绕末端局部 +x 轴（=名义焊枪轴 -x，焊枪自转 roll）：[min,max,step]（度）
  rot_y_deg: [-45, 45, 15]              # 绕末端局部 +y 轴（tilt）：[min,max,step]（度）
  rot_z_deg: [-45, 45, 15]                  # 绕末端局部 +z 轴（tilt）：[min,max,step]（度）

plan_init_pose_fast:                    # 快速几何版初始位姿求解（scripts/plan_init_pose.py:_fast_* / Scene.plan_init_pose_fast）
  # 不做 IK / 可达性 / 整臂碰撞，纯几何摆放：lay_flat 放平 → 保持放平的 8 种 90°朝向 → 焊缝中点在
  # (ee_xy_range 径向环 × ee_z_range) 内按 xy_step/z_step 网格采样平移 → 4 条过滤（两端点在范围 /
  # 底座-工件 XY 不相交 / 工件+障碍 vs init_free 无交集 / 轻去重）。返回格式与 plan_init_pose 一致。
  ee_xy_range_m: [0.4, 1.0]             # 焊缝点在 base_link 系 xy 平面到原点【径向距离】[下限,上限]（米）
  ee_z_range_m: [-0.1, 0.1]             # 焊缝点在 base_link 系 z [下限,上限]（米）
  xy_step_m: 0.20                       # 平移网格 xy 步长（米）：焊缝中点在 xy 平面按此步长采样
  z_step_m: 0.08                        # 平移网格 z 步长（米）：焊缝中点在 z 方向按此步长采样
  standoff_cm: 0.0                      # 焊枪头 goal 沿 bisector（远离工件方向）外移的 standoff 距离（cm）；0=落在焊缝中点
  base_overlap_filter: true             # 「固定底座(xiaoyu_base_link)碰撞球 vs 工件 在 base-xy 投影相交」过滤开关；
                                        #   true=相交则丢弃该候选；false=关闭。
  workpiece_x_voxel_m: 0.1             # 工件/障碍稠密点集体素粒度（米）：用于「工件+障碍 vs init_free 无交集」过滤，
                                        #   与三角形大小解耦。与碰撞 ESDF 无关。
  workpiece_x_min_m: 0.4               # 工件距 base_link 原点【欧氏最近】的那个点，其 base-x 分量下限（米）：
                                        #   须 > 此值否则丢弃（工件离底座 x 向太近/在底座后方）。仅看正 x（严格大于）。
                                        #   最近点点集复用上面的 workpiece_x_voxel_m 体素点。

observeanything:                        # 观测场景：把机械臂悬空放进 USD 里观测焊缝（gt_gen/observe_scene.py:ObserveAnythingScene）
  plan_init_pose_fast:                  # 重写版快速初始位姿求解：不动工件，直接在世界系采样机械臂 base 的 xyz+yaw
    # 采样：以焊缝中点为原点、周边 sample_cube_half_m 立方体内采样机械臂 base 的 xyz + yaw（臂竖直）
    sample_cube_half_m: 2.5             # 立方体“周边 2.5m” = 半边长（采样区 [-2.5,2.5]³，边长 5m）
    xy_step_m: 0.20                     # xy 采样间隔（米）
    z_step_m: 0.2                      # z  采样间隔（米）
    # yaw 不是世界系绝对 yaw，而是相对【机械臂 base +x 正对焊缝】基准朝向的偏差角（度，范围 -180~180，半开区间 [min,max)）
    # 基准朝向：bisector 在 base 系 y=0 且 x<0（base +x 指向焊缝）；世界 yaw = atan2(bis.y,bis.x)+180° + 本偏差
    yaw_min_deg: -1
    yaw_max_deg: 1
    yaw_step_deg: 20                    # yaw 偏差采样间隔（度）
    # 可达/过滤（口径同 plan_init_pose_fast）
    ee_xy_range_m: [0.4, 1.6]           # 端点在 base_link 系 xy 平面到原点【径向距离】[下限,上限]（米）
    ee_z_range_m: [-0.2, 0.2]           # 端点在 base_link 系 z [下限,上限]（米）
    vertical_seam_dz_m: 0.15            # 竖/横焊缝判据：焊缝起终点世界系高度差 |p0.z-p1.z| > 此值 ⇒ 竖焊缝（端点只判 xy 径向、不判 z）；否则横焊缝（xyz 全判）
    seam_center_x_min_m: 0.4            # 焊缝中点 base-x 下限（米，取代「工件最近点 base-x」判据）
    standoff_cm: 0.0                    # goal 沿 bisector（远离工件方向）外移的 standoff 距离（cm）
    workpiece_x_voxel_m: 0.1            # 场景体素点粒度（米），供「场景 vs init_free 无交集」过滤用
    front_face_filter: false            # 正面过滤 bis_base.z≥0：只在焊缝正脸可见的朝向放相机。false=去掉该过滤。（正/反手分类已改用「初始相机可见性」，见 plan_observe_scene.md §7，不再由此过滤兼任）
    debug_max_per_step: 200             # debug=True 时逐步过滤快照每步随机抽样上限（防 pkl 膨胀；合格步全存不受限）
    sort_yaw_weight: 0.3                # 候选排序（差异大排前面）里 yaw 相对权重：合成差异 = xyz欧氏距离 + 此值×yaw环形角距（各按最大量级归一）；<1 表示 xyz 比 yaw 更重要
    # 正/反手分类（plan_observe_scene.md §7）：backhand ⇔ 初始关节角(retract_config)下末端相机对该焊缝完全看不到
    visible_num_samples: 20             # 沿焊缝均匀取几个点判可见性（可见=在相机内参FOV内 且 未被裁剪块 mesh 遮挡）
    block_radius_m: 0.04                # 遮挡容差圆盘半径（米）：把视线加粗成 4cm 圆柱去探遮挡（沿用 config_pose.block_radius）
    num_block_pts: 6                    # 遮挡判定沿圆盘周向的偏移射线条数（沿用 config_pose.num_block_pts）
  crop:                                 # USD→obj 邻域裁剪（gt_gen/observe_scene.py:_crop_neighborhood_obj）
    crop_radius_m: 3.5                  # 焊缝中心球半径（米）：球内整块 prim 保留；≳ sample_cube_half_m + ee_xy_range 上限
    watertight: false                   # false=拼接(concatenate，快、每壳闭合，碰撞够用)；true=make_watertight 布尔并集成单一流形(慢)
# init_free 仍走顶层 init_free.*_for_init（method_for_init / box_*_for_init），与父类一致

plan_init_pose_kejian:                         # lookup 式初始位姿求解（scripts/plan_init_pose.py --solve）的关节角过滤
  # precompute_joint_table 对 n^6 采样的关节角做 FK 后，只保留焊枪末端位姿（base_link 系）满足下列约束的：
  #   ① xy 平面到原点距离 ∈ ee_xy_range_m；② z ∈ ee_z_range_m；③ 落在 init_free.box_min_m/box_max_m 盒内。
  ee_xy_range_m: [0.4, 1.0]             # 焊枪末端 xy 平面到 base_link 原点距离 [下限,上限]（米）
  ee_z_range_m: [-0.1, 0.1]             # 焊枪末端在 base_link 系 z [下限,上限]（米）
  collision_tolerance_m: 0.00           # 整臂/retract 碰撞球对工件 ESDF 的允许穿透阈值（米，d<=tol 判 safe）
  voxel_size_m: 0.01                    # 工件 ESDF 体素大小（米）
  n_seg: 20                             # save_seam_pkl 的 seam_line 插值点数
  standoff_cm: 2.0                     # 焊枪头落点沿焊缝角平分线(bisector，远离工件方向)外移的 standoff 距离(cm)；
  rot_x_deg: [-180, 180, 60]              # 绕末端局部 +x 轴（=名义焊枪轴 -x，焊枪自转 roll）：[min,max,step]（度）
  rot_y_deg: [-30, 30, 15]              # 绕末端局部 +y 轴（tilt）：[min,max,step]（度）
  rot_z_deg: [-30, 30, 15]                  # 绕末端局部 +z 轴（tilt）：[min,max,step]（度）
  # —— 新逻辑（--solve-kejian）：固定朝向 + 平移网格 + STOMP 可达。不再 n^6 采样关节角。 ——
  xyz_step_m: [0.3, 0.3, 0.2]        # 工件平移网格步长 [dx,dy,dz]（米，base 系）；撒点方框
                                        # x,y∈[-ee_xy_hi,ee_xy_hi]、z∈ee_z_range_m，再丢弃「焊缝起/中/终
                                        # 任一点 径向xy∉ee_xy_range 或 z∉ee_z_range」的候选。
  ik_return_seeds: 30                   # 预筛阶段每个 goal 朝向 IK 取回的候选解数（逐个 check_state 过碰撞）
  ik_num_seeds: 60                      # 预筛专用 IK 的并行随机起点数（须 ≥ ik_return_seeds）。不用 planner.ik_num_seeds(200)：
                                        #   预筛是批量 IK，峰值显存≈chunk×num_seeds，200 会爆显存（见 docs 注）。60 够筛掉不可达。
  ik_batch: 24                          # 预筛批量 IK 的分块大小：每次只送 ik_batch 个 goal 朝向进 solve_batch，
                                        #   峰值显存≈ik_batch×ik_num_seeds。一个候选的全部 goal 分多块循环，避免一把 OOM。

plan_init_pose_kejian2:                  # lookup(n^6 关节角采样, 复用 plan_init_pose.py:InitPoseLookupSolver) + 允许朝向 snap + 正反手分类
  # 路线（scripts/plan_init_pose_kejian2.py --solve-kejian2）：
  #   ① InitPoseLookupSolver 采 n_per_dof^6 关节角做 FK，按下列 ee_xy/ee_z 范围 + init_free 盒过滤可达构型，
  #      每条焊缝 batch 反解出候选工件位姿 (R,t,q)，并用「整臂/retract 碰撞球 vs 工件 ESDF」过滤掉碰撞解；
  #   ② 从候选里挑「旋转 R 与 4 种允许朝向（lay_flat / 沿最长轴翻180° / 沿垂直地面轴翻180° / 两者皆翻；
  #      最长轴 ⊥ base-x）某一种的 xyz 三方向逐轴误差 < snap_deg」者，把 R snap 到该朝向、重算 t 让焊枪尖端
  #      仍落在焊缝 standoff 点（snap 后不复检）；③ 过滤：焊缝中心点须在 base-x>0；焊缝须在「正面」
  #      （bisector 在 base-z 分量<0 ⇒ 焊缝朝下=背面，丢弃）；且固定底座(xiaoyu_base_link)碰撞球与工件
  #      在 base-xy 投影不能相交（相交=机械臂压在工件下，丢弃；工件投影取【三角形投影并集】精确判定，非凸包）；④ 按【bisector】
  #      在 base-x 的分量分「正手(与 base-x 反向=负x) / 反手(否则)」（焊缝几何，与关节构型无关）。
  ee_xy_range_m: [0.4, 1.0]             # 焊缝点 xy 平面到 base_link 原点距离 [下限,上限]（米）
  ee_z_range_m: [-0.1, 0.1]             # 焊缝点在 base_link 系 z [下限,上限]（米）
  # n_per_dof: [15, 15, 15, 24, 24, 24]   # 每关节采样档数 [link1..link6]；q_table = ∏ni = 2,949,120（≈ 旧 12^6=2.99M，不易 OOM）。
  n_per_dof: [12, 12, 12, 12, 12, 12]   # 每关节采样档数 [link1..link6]；q_table = ∏ni = 2,949,120（≈ 旧 12^6=2.99M，不易 OOM）。
                                        #   也可填标量(如 12)=各关节同档(=n^6，旧行为)。本表：基座 joint0/1/2 取 16(定位更细)，
                                        #   腕部 joint3/4 取 10/12，joint5(腕滚 ±6.2rad，与 rot_x roll 冗余) 取 6。
                                        #   想加精度就调大对应关节；显存≈幸存者数×碰撞球，先小步加。改了此值须重算关节表缓存。
  collision_tolerance_m: 0.0             # 整臂/retract 碰撞球对工件 的允许穿透阈值（米，d<=tol 判 safe）。
                                        #   d=get_collision_distance 是【碰撞代价，clamp≥0】：不碰撞恒=0、穿透才>0，
                                        #   不返回负的「间隙」。故 tol 只能 >=0：0=不许碰(贴着算过)，正值=允许穿透 tol 米。
                                        #   ⚠ 负值永远无解（d 最小就是 0，<=负数恒 False）。想让手臂离工件留 g 间隙，
                                        #     不能设负 tol，要把碰撞球半径膨胀 g 再判（见 _voxel_collision_distance_batch）。
  clearance_inflate_m: 0.01              # 间隙膨胀量(米)：所有碰撞球半径 +此值再判碰，等效要求整臂离工件留间隙；0=关闭。
                                        #   collision_tolerance_m 不支持负数(d=穿透代价恒>=0，<=负 tol 恒 False)，
                                        #   故"离工件留间隙"只能靠膨胀碰撞球半径实现，即本项。
  voxel_size_m: 0.01                    # 工件 ESDF 体素大小（米）
  standoff_cm: 2.0                      # 焊枪头落点沿 bisector（远离工件方向）外移的 standoff 距离（cm）
  rot_x_deg: [-180, 180, 30]            # lookup 绕末端局部 +x 轴（=名义焊枪轴 -x，焊枪自转 roll）：[min,max,step]（度）
  rot_y_deg: [-30, 30, 15]              # lookup 绕末端局部 +y 轴（tilt）：[min,max,step]（度）
  rot_z_deg: [-30, 30, 15]              # lookup 绕末端局部 +z 轴（tilt）：[min,max,step]（度）
  snap_deg: 10.0                        # 候选朝向 vs 4 种允许朝向：xyz 逐轴旋转误差上限（度）；三轴全在内才保留并 snap 到该朝向
  joint_table_path: "configs/plan_init_kejian2_joint_table.pt"  # 独立的关节表缓存。注意：过滤范围与 plan_init_pose 不同，
                                        #   而 load_joint_table 只校验 n_per_dof（不校验范围），共用会读到错的关节集，必须分开存。


gt:                                     # 决策 G
  format: "custom"                      # 用本项目自定义格式（不沿用 traj.pkl），schema 在 Step 11 定

env:                                    # 决策 F
  conda_env: "env_isaaclab"             # curobo 0.0.post1.dev24 / torch 2.7+cu128 / CUDA 可用

planner:                                # cuRobo IK / 规划参数（见 curobo_iface）
  ik_num_seeds: 200                     # 每个 IK 问题并行优化的随机起点数（cuRobo 默认 100）
  ik_return_seeds: 200                  # plan_to_pose 取回的候选解数(多解轮询)，须 ≤ ik_num_seeds
  position_threshold: 0.05              # 位置收敛门限（米）；init_curobo 不传时用此值
  rotation_threshold: 0.5               # 朝向收敛门限（四元数测度 sin(θ/2)，≈60°）；同上
  max_attempts: 20                      # plan_on_truth / plan_to_pose 最大规划尝试次数（单一来源）
  drop_collision_links: []  # 从碰撞检查剔除的 link（单一来源：init_curobo 不传时读这里）。空=不剔除任何 link，焊枪也参与避障
  voxel_inflate_voxels: 0   # sync_collision_world 把「非 FREE」障碍向 FREE 膨胀的体素层数。
                            # cuRobo voxel 规划只保证球心避障，而保守判据 motion_stays_in_free 对整臂扫掠
                            # 做 (r+√3/2·voxel) 过近似 → 差约 1 体素。膨胀 1 层使 cuRobo 规划留出一致余量，
                            # 保证 GT 整臂扫掠真正 ⊆ FREE（0 擦边 UNKNOWN）。
  # ↓ 提高规划成功率的三个杠杆（见 curobo_iface.init_curobo / plan_to_config，单一来源）
  num_trajopt_seeds: 24     # trajopt 并行优化的轨迹起点数（init 时定）。比串行加 max_attempts 又快又稳：
                            #   GPU 一把并行铺 N 条取最优，压住「随机起点陷局部最优」的失败。cuRobo 默认偏小(4)。
                            #   注意：plan_single* 路径下 graph planner 的并行种子数也取此值（cuRobo 把
                            #   graph seeds 硬绑到 trajopt seeds，无独立 num_graph_seeds 旋钮）。
  enable_graph: true        # 规划先跑 graph planner 找全局可行折线、再 trajopt 平滑。窄通道/绕障场景
                            #   （正是放障碍后的绕行）trajopt 易陷局部最优失败，graph 先给可行拓扑→命中率最大提升。
                            #   代价：更慢。trajopt 种子里一部分由 graph 解插值生成，故与 num_*_seeds 搭配调最有效。
  time_dilation_factor: 1.0 # 轨迹时间放慢系数 ∈(0,1]：把速度/加速度上限按比例缩小，松动力学约束。
                            #   对「几何可行但太赶、撞速度/加速度极限」的失败有效；只改快慢不改路径形状（GT 轨迹更慢）。
  # ↓ 规划后端开关：obstacle_placement 的「默认轨迹 / 绕行解」用哪种规划器（碰撞判定 check_state 不受影响，恒用 cuRobo）
  backend: stomp           # curobo | stomp。curobo=MotionGen(graph+trajopt)；stomp=本项目 stomp_planner 的 STOMP。
  stomp:                    # backend=stomp 时透传 stomp_planner/stomp_planning_api 的旋钮（curobo 时整段忽略）
    # STOMP 核心已 vendoring 到本项目 stomp_planner/；默认用项目内目录（见 config.py），
    # 无需在此写绝对路径。如需覆盖：加 stomp_planner_dir: <路径> 或设 env STOMP_PLANNER_DIR。
    num_iterations: 120     # 迭代轮数（搜索深度）：越大收敛越充分越能绕开，越慢
    num_batch: 1            # 并行候选条数（搜索宽度）：越大越不易陷局部最优，取状态代价最小那条输出
    num_timesteps: 151       # 轨迹时间步数
    delta_t: 0.1            # 步长（秒）；也是产出 npz 的回放 dt
    collision_weight: 80.0  # 碰撞代价权重
    buffer_m: 0.001         # STOMP 自身的碰撞激活距离≈0：间隙完全来自障碍物理膨胀(obstacle_buffer_m)，工件不膨胀，
                            #   两后端在同一个 world（默认=仅工件 / 绕行=障碍已膨胀）里规划，只换规划器
    voxel_world: cuboid     # 探索世界 voxmap→STOMP 世界的转法：mesh=marching-cubes 网格化全 ROI 自由泡边界；
                            #   cuboid=仅 base 原点为心 ±local_box_m 盒内的非 FREE 体素→贪心合并成大盒(PRIMITIVE)
    local_box_m: 2.5          # cuboid 模式：以 base 原点(0,0,0)为心、半边长 n=此值(米) 的盒 [−n,n]³ 内才转换；
                            #   盒外 UNKNOWN 当 FREE 可穿行（放宽保守性换速度）。盒内占据会贪心合并成少量大盒
    # 早停（Layer3 提速）：solve 不再恒跑满 num_iterations——一旦某条 batch 已无碰撞
    #   (state_cost≈0，与合格判据 n_collision_steps==0 同源) 且其总代价进入平台期就提前退出。
    early_stop: true          # 关掉=恒跑满 num_iterations（回到原行为）
    early_stop_patience: 8    # 连续几轮「总代价改进不足」判定平台期
    early_stop_min_iters: 30  # 至少先跑够几轮再允许早停（避免过早收敛）
    early_stop_rel_tol: 0.001 # 相对改进阈值：(prev-cur)/|prev| ≤ 此值算「没进步」
    early_stop_min_delta: 0.0001  # 绝对改进阈值（与 rel_tol 取和作门限）
    early_stop_state_tol: 0.001   # state_cost ≤ 此值算「无碰撞候选」（碰撞权重×距离和，无碰=0）

# 以下参数留待对应步骤填实（先放占位/默认）
params:
  nbv:
    k_lookahead: 6                      # B 取 P* 前方几个路点（Step 7）
    standoff_d_m: [0.55, 0.85, 1.05]    # 站位距离档（Step 8）
    n_view_dirs: 32                      # 每档观察方向数（Step 8）
    max_look_deg: 20                    # 候选看向校验：相机光轴对准 T 的最大夹角°（Step 8，兜 cuRobo 朝向阈值偏松）
    ik_return_seeds: 8                   # 候选生成批量 IK 每个位姿取回的解数（Step 8）：下游只用前 ik_per_pose(=2)，取小省 GPU→CPU 拷回
    ik_batch: 24                        # 候选生成批量 IK 的分块大小：一次 solve_batch 送几个位姿——峰值显存≈ik_batch×planner.ik_num_seeds(200)，太大 OOM
    cluster:                            # 阻塞段 B 聚类（Step 8，scipy 层次聚类 linkage+fcluster）
      max: 3                            # 最多簇数（超出则保留最大的簇心 + 全部点重指派到最近簇心覆盖）
      link_dist_m: 0.15                 # 距离阈值（fcluster criterion='distance' 的 t）：簇内最近邻间距 ≤ 此值归一簇
      method: "single"                  # linkage 连接法：single(链式,适合连通体素块)/complete/average/ward
    lambda_cost: 10                    # score_candidate fun 增益 vs 焊枪平移代价(m)权重（Step 9）
    lambda_angle: 5                    # score_candidate fun 增益 vs 焊枪朝向变化代价(rad,测地角)权重（Step 9，0=关）
    version: "oracle_path"              # 或 "line_weighted"(v1 fallback)
  loop:
    max_rounds: 15                     # 主循环最大轮次（Step 10）
    stuck_rounds: 3                     # 连续无进展判卡死（Step 10）
    observe_every_n: 2000000                 # 步⑤ _move_to 移动时，每隔 N 个插值路点 _observe 一次（边走边拍，Step 10）
  swept:
    interp_resolution_m: 0.01           # 扫掠体积插值精度（Step 6）

obstacle_placement:                     # 障碍物放置参数，按【障碍物类型】分三段（type1/type2/type3）
  # 层级：obstacle_placement.<type1|type2|type3>。三类障碍互相独立，各自读自己那段：
  #   type1 = 沿「关键 link 扫掠走廊」自动放障碍（见 docs/障碍物位置.md，gt_gen/obstacle_placement.py）
  #   type2 = 焊缝旁遮挡板候选（Scene.add_obstacle_type2，示例 scripts/viz_seam_plate_candidates_isaacsim.py）
  #   type3 = 把焊缝包住的开口障碍（Scene.add_obstacle_type3，示例 scripts/viz_seam_open_box_isaacsim.py）

  type1:                                # 障碍物类型1：在指定 link 扫掠走廊里放 1 个障碍（Scene.add_obstacle_type1）
    # add_obstacle_type1(link,...) → place_in_corridor 解析解放 1 个【原尺寸】障碍：与该 link 扫掠球并集有交、
    # 且整只落在 init_free 外。放不下就在 max_attempts 内换类型/尺寸重试。不做三条件验证、不重新规划。
    max_attempts: 20                    # 单次放置失败后换类型/尺寸的最大重试次数
    pos_t_window: [0.25, 0.85]          # 选 anchor 的轨迹时间窗（避开起点 init_free 段与终点焊缝段）
    goal_clearance_m: 0.25              # anchor 距 goal 位置的最小距离（不要紧贴焊缝）
    angle_jitter_deg: 20                # 三轴随机旋转幅度(每轴±度)：+X 对齐扫掠切向后，再绕 body xyz 各随机转一次，
                                        # 仅为姿态多样性（非优化）。20≈轻抖仍大体横挡走廊；调到 180 ≈ 全随机朝向
    yaw_search_max_deg: 0.0             # 水平偏航求解范围(±度)：0=关闭角度优化，只做纯法线外推(ψ=0)；
                                        # >0 才在 [-此值,+此值] 内搜「外推量最小且仍咬扫掠管」的偏航角（默认曾 90）
    thickness_range_m: [0.02, 0.05]     # 板/壁厚 th 的随机采样[下界,上界]（米，每次放置在此区间均匀取）
    # 注：尺寸相关的 size_scale_range / span_clip_m / tube_r_clip_m 已【按类型】下放到 obstacle_params，各类型单独控制

    obstacle_types:                     # 1候选障碍类型（缺省随机抽一种，用 seed+seam_id 复现）；注释掉不想要的即可
      - plate                           # 单块钢板（法向+X，正面横挡走廊）
      - l_bracket                       # L 型钢板（└，一竖板+一横板）
      - u_channel                       # U 型槽（开口朝上，工件可落槽内）
      - pipe                            # 单根圆管（横跨走廊）
      - parallel_pipes                  # 多根平行管（护栏/管束）
      - crossed_pipes                   # 交叉管（X 形）
      - box_beam                        # 方管/方梁（实心方截面）
      - rect_frame                      # 矩形管框架（中间留孔）
      - gantry                          # 门型框架（两立柱+横梁）
      - braced_frame                    # 斜撑框架（矩形框+对角斜梁）
      - tripod                          # 三角支架（三杆竖立三角框）

    obstacle_params:                    # 各类型的尺寸/离散选项/结构数/缩放系数(_mult)与下限(_min)，【按类型单独控制】。
                                        # 每类型可含 3 个尺寸旋钮（缺省用行内默认）：
                                        #   size_scale_range [lo,hi] —— 尺寸相对局部走廊管半径的缩放采样区间（span=2·tube_r·此值）
                                        #   span_clip_m      [lo,hi] —— 主跨度 s=clip(span,·)：下界保证横挡走廊、上界防塞满场景（所有类型都用）
                                        #   tube_r_clip_m    [lo,hi] —— 杆/管/梁截面半径 rt=clip(tube_r,·)：【仅用 rt 的类型才写】
                                        # 尺寸主体仍随走廊自适应：s=span(clip后)、rt=tube_r(clip后)、th=thickness_range_m 取样；
                                        # 只覆盖这里列出的键，未列的回退 _shape_for 内置默认（整段留 {} 即全用默认）。
                                        # 注：plate/l_bracket/u_channel 不用 rt，故不写 tube_r_clip_m。
      plate:            {size_scale_range: [0.4, 0.5], span_clip_m: [0.15, 2.2], tilt_deg: 0.0}                 # 绕 Y 倾角(度)
      l_bracket:        {size_scale_range: [1.0, 2.1], span_clip_m: [0.15, 2.2]}                               # 纯尺寸，无离散项
      u_channel:        {size_scale_range: [1.0, 2.1], span_clip_m: [0.15, 2.2], height_mult: 0.7}             # 侧板高 = s×0.7
      pipe:             {size_scale_range: [0.6, 0.7], span_clip_m: [0.15, 2.2], tube_r_clip_m: [0.04, 0.20], axis: y, length_mult: 4.5}    # 管轴 x/y/z；管长 = s×1.5
      parallel_pipes:   {size_scale_range: [0.6, 1.6], span_clip_m: [0.15, 2.2], tube_r_clip_m: [0.04, 0.20], n: 3, axis: y, stack: z, length_mult: 1.5, gap_mult: 0.5} # n 根；沿 stack 以 gap=s×0.5 排开
      crossed_pipes:    {size_scale_range: [0.6, 1.6], span_clip_m: [0.15, 2.2], tube_r_clip_m: [0.04, 0.20], cross_deg: 90.0, length_mult: 1.5}                        # 两管夹角(度)；管长 = s×1.5
      box_beam:         {size_scale_range: [0.6, 1.6], span_clip_m: [0.15, 2.2], tube_r_clip_m: [0.04, 0.20], axis: y, length_mult: 1.5, side_mult: 1.4, side_min: 0.06}# 方截面边长 = max(side_min, rt×side_mult)
      rect_frame:       {size_scale_range: [0.6, 1.6], span_clip_m: [0.15, 2.2], tube_r_clip_m: [0.04, 0.20], beam_min: 0.06}               # 边框方梁截面 = max(beam_min, rt)
      gantry:           {size_scale_range: [0.6, 2.6], span_clip_m: [0.15, 2.2], tube_r_clip_m: [0.04, 0.20], post_min: 0.06, beam_min: 0.08} # 立柱/横梁截面下限
      braced_frame:     {size_scale_range: [0.6, 2.6], span_clip_m: [0.15, 2.2], tube_r_clip_m: [0.04, 0.20], beam_min: 0.06, brace_mult: 0.8, brace_min: 0.05} # 斜撑截面 = max(brace_min, rt×brace_mult)
      tripod:           {size_scale_range: [0.6, 1.6], span_clip_m: [0.15, 2.2], tube_r_clip_m: [0.04, 0.20], base_half_mult: 0.5, rod_min: 0.05} # 底半宽 = s×0.5；杆半径 = max(rod_min, rt)

  type2:                                # 障碍物类型2：焊缝旁遮挡板（固定候选 C1，示例 launch.json:viz_seam_plate_candidates_isaacsim）
    # Scene.add_obstacle_type2 按本段参数据焊缝几何(切线 t / 两面表面方向 d1,d2 / 角平分线 bis)造遮挡板：
    #   固定 C1 = 水平板·焊缝正上方对称（∥地面a面、沿壁方向抬高 n_cm、板心在焊缝正上方、宽沿±对称）。
    # 数值参数（n_cm/width_cm/length_pct/length_min_cm/thickness_cm）支持区间随机：写成
    #   X_min + X_max（两者都有）则每次放置在 [min,max] 均匀随机取（seed+seam_id 决定，可复现）；
    #   只写固定 X 则用定值。示例：n_cm 已改成区间，其余仍是定值——想随机哪个就把它改成 _min/_max。
    shape: plate                        # 板外形：plate=完整矩形 / triangle=角平分线三角 / trapezoid=随机倒角梯形
    n_cm_min: 8.0                       # 离焊缝距离 n(cm) 下限：C1 沿壁方向的抬高量，在 [min,max] 均匀随机
    n_cm_max: 14.0                      # 离焊缝距离 n(cm) 上限
    width_cm_min: 20.0                      # 板宽(cm)下限
    width_cm_max: 40.0                      # 板宽(cm)上限
    length_pct_min: 80.0                   # 板长占焊缝弧长百分比(%)下限
    length_pct_max: 100.0                   # 板长占焊缝弧长百分比(%)上限
    length_min_cm: 3.0                  # 板长下限(cm)：实际板长 = max(length_pct%×焊缝弧长, 此值)
    thickness_cm_min: 1.5                   # 板厚(cm)下限
    thickness_cm_max: 3.0                   # 板厚(cm)上限
    seed: 0                             # trapezoid 随机倒角 & 数值区间采样的种子（可复现；plate/triangle 倒角不用）

  type3:                                # 障碍物类型3：把焊缝包住的开口障碍（示例 launch.json:viz_seam_open_box_isaacsim）
    # Scene.add_obstacle_type3 用 1 个开口障碍把焊缝那段包住；大小+焊缝在其中的位置由 6 个面到焊缝的
    # 最近距离 dis 唯一解出。开口面=后(back)，朝焊缝角平分线水平投影方向（bis 从开口穿出）。
    obstacle: open_box                  # 障碍类型：open_box=开1面的盒 / open_cylinder=开1面的圆筒(圆管杯) 目前不支持
    dis_cm: [100, 100, 100, 100, 100, 100]  # 焊缝到盒 6 面最近距离(cm)，顺序=上 下 左 右 前 后；后=开口面
    wall_cm: 2.0                        # 盒壁厚(cm)（open_cylinder 光滑 mesh 时仅占位）
