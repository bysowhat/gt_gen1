# GT 生成配置 —— Step 0 锁定的决策（见 docs/implementation-steps.md）

robot:                                  # 决策 B
  cfg_path: "/home/a/Datas/curobo/example_new_robot/urdf_12e/ur12e.yml"
  # cfg_path: "/kpfs_dataset/dataset/baiyu/code/render/urdf_12e/ur12e.yml"
  # ee_link / joint_names / retract_config 从上面的 cfg 读取，不在此重复

constraint:                             # 决策 A
  scope: "whole_arm"                    # 整臂本体（整条臂扫掠体积 ⊆ FREE）

scene:                                  # 决策 C
  format: "obj_mesh"                    # 输入为 watertight .obj
  example: "/media/a/新加卷/hanfeng/segment_sub_output/BEAM_1aEEYa00Ed5Z4sE34qDJKu_part/BEAM_1aEEYa00Ed5Z4sE34qDJKu_part_watertight.obj"
  # 焊缝/目标位姿来源（hanfeng_* 字段）
  weld_pkl_example: "/home/a/Datas/20251201/aligned_ifc_parts_7/BEAM_1GMGl500020p4pD3WmDJ8n_part.pkl"

sensor:                                 # 决策 D + E
  mode: "self_raycast"                  # 自己对 mesh raycast，不依赖 Isaac 渲染
  max_depth_m: 3.0                      # raycast 深度上限 3 米（决策 D）
  camera:                               # 单个相机（无左右目），参数来自 IsaacLab PinholeCameraCfg
    name: "camera"
    width: 960
    height: 540
    modalities: ["rgb", "depth"]
    # 针孔模型原始参数
    focal_length: 4.01
    focus_distance: 480.0
    horizontal_aperture: 8.064
    vertical_aperture: 4.5365
    clipping_range: [1.0e-5, 1.0e3]     # 注意：实际 raycast 截断用 max_depth_m=3.0
    # 推导像素内参 fx = focal_length * width / horizontal_aperture
    intrinsics: {fx: 477.4, fy: 477.4, cx: 480.0, cy: 270.0}
    # 安装：相对 Link6（注意不是 ee_link xiaoyu_tip_link）
    # 【已可视化确认 2026-06-02】相机帧 = T_base_Link6 @ T(extrinsic_pos, extrinsic_quat_wxyz)
    # 光学约定 OpenCV：+Z=视线朝前、+X 右、+Y 下；不套 USD 的 diag(1,-1,-1) 翻转
    mount_link: "Link6"
    extrinsic_pos: [-0.08318594, -0.01074588, 0.20808960]
    # 参考 ik_cam.py(L17) + gt_math.py：此 quat 按 (w,x,y,z) 解释（= cuRobo 约定，无需转换）
    extrinsic_quat_wxyz: [0.67914898, -0.11969930, -0.21945439, -0.69012209]
    reference: "/home/a/Projects/Github/kejian_benchmark/gt_benchmark_pose_fast"  # env/ik_cam.py, gt_math.py

roi:                                    # 决策 H —— ROI 盒（单一来源；init_curobo 与 build_roi_voxmap 都读这里）
  # 由整臂可达工作空间实测（20000 随机关节角的碰撞球包围盒）+ 余量取整得到，见
  # docs/implementation-steps.md「ROI 标定」。两网格(voxmap / cuRobo voxel 世界)同框、不再各填默认。
  mode: "measured_box"                  # ROI 直接由 center/dims 给定（不再用 reach+expand 推算）
  center: [0.1, 0.0, 0.65]              # ROI 盒中心（base 系，米）
  dims: [3.8, 3.92, 3.6]                # ROI 盒尺寸（米）。每轴须为 voxel_size 整数倍：
                                        #   3.8/0.04=95, 3.92/0.04=98, 3.6/0.04=90（皆整数）。
                                        #   半体素(如 3.9→97.5)会触发 cuRobo CUDA/Python 栅格维度取整
                                        #   不一致 → voxel 占据沿该轴错位（见 config.roi_dims 注释）。
                                        #   config.roi_dims 会再吸附一次作兜底。
  voxel_size_m: 0.04                    # 体素边长（米）

goal:                                   # 末端目标相对焊缝的摆放（Step 10）
  standoff_cm: 10.0                     # 沿两面角平分方向(bisector, 背离工件)后退的 standoff 距离(cm)
                                        # 目的：目标离工件表面够远(>体素膨胀带)，纯 voxel 探索世界不会误判碰撞；
                                        # GT 轨迹终点即停在此 standoff 位姿（不再向表面靠近）。

init_free:                              # 初始引导 FREE 空间（见 docs/initial-free-space.md）
  # 末端相机初始视野极小，voxmap 全 UNKNOWN 时整臂扫掠必含 UNKNOWN → reach_pt=0，机械臂动不了。
  # 故在 retract（固定安全 home）邻域把"各关节小幅 ±dq 活动"整臂扫过的体素预标 FREE，让其能起步。
  # dq 由 tmp/plan_seam 轨迹标定：0.05rad 即 122/122 条起步(reach_idx≥4)，取 0.10rad 留余量。
  dq_rad: 0.10                          # 关节扫掠法：retract 各关节活动半幅（rad）
  cyl_radius_m: 0.60                    # 圆柱体法：半径（米，轴过 base 原点 x=y=0）
  cyl_height_m: 1.80                    # 圆柱体法：高度（米，从 base_link 平面 z=0 往上）

gt:                                     # 决策 G
  format: "custom"                      # 用本项目自定义格式（不沿用 traj.pkl），schema 在 Step 11 定

env:                                    # 决策 F
  conda_env: "env_isaaclab"             # curobo 0.0.post1.dev24 / torch 2.7+cu128 / CUDA 可用

planner:                                # cuRobo IK / 规划参数（见 curobo_iface）
  ik_num_seeds: 100                     # 每个 IK 问题并行优化的随机起点数（cuRobo 默认 100）
  ik_return_seeds: 100                  # plan_to_pose 取回的候选解数(多解轮询)，须 ≤ ik_num_seeds
  position_threshold: 0.05              # 位置收敛门限（米）；init_curobo 不传时用此值
  rotation_threshold: 0.5               # 朝向收敛门限（四元数测度 sin(θ/2)，≈60°）；同上
  max_attempts: 200                      # plan_on_truth / plan_to_pose 最大规划尝试次数（单一来源）
  drop_collision_links: []  # 从碰撞检查剔除的 link（单一来源：init_curobo 不传时读这里）。空=不剔除任何 link，焊枪也参与避障
  voxel_inflate_voxels: 0   # sync_collision_world 把「非 FREE」障碍向 FREE 膨胀的体素层数。
                            # cuRobo voxel 规划只保证球心避障，而保守判据 motion_stays_in_free 对整臂扫掠
                            # 做 (r+√3/2·voxel) 过近似 → 差约 1 体素。膨胀 1 层使 cuRobo 规划留出一致余量，
                            # 保证 GT 整臂扫掠真正 ⊆ FREE（0 擦边 UNKNOWN）。

# 以下参数留待对应步骤填实（先放占位/默认）
params:
  nbv:
    k_lookahead: 6                      # B 取 P* 前方几个路点（Step 7）
    standoff_d_m: [0.55, 0.75, 0.95]    # 站位距离档（Step 8）
    n_view_dirs: 8                      # 每档观察方向数（Step 8）
    max_look_deg: 20                    # 候选看向校验：相机光轴对准 T 的最大夹角°（Step 8，兜 cuRobo 朝向阈值偏松）
    cluster:                            # 阻塞段 B 聚类（Step 8，scipy 层次聚类 linkage+fcluster）
      max: 3                            # 最多簇数（超出则保留最大的簇心 + 全部点重指派到最近簇心覆盖）
      link_dist_m: 0.15                 # 距离阈值（fcluster criterion='distance' 的 t）：簇内最近邻间距 ≤ 此值归一簇
      method: "single"                  # linkage 连接法：single(链式,适合连通体素块)/complete/average/ward
    lambda_cost: 0.1                    # 增益 vs 路径代价权重（Step 9）
    version: "oracle_path"              # 或 "line_weighted"(v1 fallback)
  loop:
    max_rounds: 200                     # 主循环最大轮次（Step 10）
    stuck_rounds: 5                     # 连续无进展判卡死（Step 10）
    observe_every_n: 3                 # 步⑤ _move_to 移动时，每隔 N 个插值路点 _observe 一次（边走边拍，Step 10）
  swept:
    interp_resolution_m: 0.01           # 扫掠体积插值精度（Step 6）

obstacle_placement:                     # 沿「关键 link 扫掠走廊」自动放障碍（见 docs/障碍物位置.md）
  # 底层 place_in_corridor 按参数（link/类型/尺寸/角度/位置）放 ≤M 个障碍；上层 search_placement
  # 失败就改尺寸/角度/位置重试至 N 次。判定「合适」三条件：①默认路径碰撞 ②仍有绕行解 ③绕行明显不同。
  max_per_scene: 1                      # M：每个场景最多障碍数（先实现 M=1）
  max_attempts: 200                      # N：单个 (link,type) 放置失败后的最大重试次数
  detour_max_attempts: 30               # 绕行可行性判定(detour_exists)的 plan 尝试次数。
                                        # 独立于 planner.max_attempts(=200，那是产最终 GT 用的余量)；
                                        # 这里只判「是否存在绕行解」，无需跑满 → 取小值大幅提速
                                        # （障碍挡死时是最坏情况：ik_return_seeds 个候选 × 此值，全失败才返回）。
  key_links: ["Link2", "Link3", "Link4", "Link5", "Link6", "xiaoyu_accessory_link"]
  pos_t_window: [0.25, 0.85]            # 选 anchor 的默认轨迹时间窗（避开起点 init_free 段与终点焊缝段）
  goal_clearance_m: 0.25               # anchor 距 goal 位置的最小距离（不要紧贴焊缝）
  size_scale_range: [0.6, 1.6]          # 障碍尺寸相对局部走廊管半径的缩放采样区间
  angle_jitter_deg: 180                  # 角度扰动幅度（度）
  pos_jitter_m: 0.40                    # 位置扰动幅度（米）
  detour_min_joint_rad: 0.3            # 条件③：绕行 vs 默认的关节空间最大偏差阈值（rad）
  obstacle_types: []                    # 空=用 obstacles.list_obstacles() 全部 15 种
  # _shape_for 的尺寸夹紧/采样区间（不写死在代码里，单一来源）
  span_clip_m: [0.15, 2.2]              # 障碍主跨度 s=clip(span,·) 的[下界,上界]（米）：下界保证大到能横挡走廊，上界防塞满场景无解
  tube_r_clip_m: [0.04, 0.20]           # 杆/管/梁截面半径 rt=clip(tube_r,·) 的[下界,上界]（米）：下界防细到漏过，上界防单管成大圆柱
  thickness_range_m: [0.02, 0.05]       # 板/壁厚 th 的随机采样[下界,上界]（米，每次放置在此区间均匀取）
